<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Registration Form | Validation Demo</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <main class="form-container">
    <h1>Create an Account</h1>
    <p class="subtitle">Fill in your details below</p>

    <form id="registrationForm" novalidate>

      <!-- Full Name -->
      <div class="form-group">
        <label for="fullName">Full Name</label>
        <input type="text" id="fullName" name="fullName" placeholder="Your Name" autocomplete="name" />
        <span class="error-message" id="fullNameError"></span>
      </div>

      <!-- Email -->
      <div class="form-group">
        <label for="email">Email Address</label>
        <input type="text" id="email" name="email" placeholder="you@example.com" autocomplete="email" />
        <span class="error-message" id="emailError"></span>
      </div>

      <!-- Phone -->
      <div class="form-group">
        <label for="phone">Phone Number</label>
        <input type="text" id="phone" name="phone" placeholder="10-digit mobile number" autocomplete="tel" />
        <span class="error-message" id="phoneError"></span>
      </div>

      <!-- Password -->
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="At least 8 characters" autocomplete="new-password" />
        <span class="error-message" id="passwordError"></span>
      </div>

      <!-- Confirm Password -->
      <div class="form-group">
        <label for="confirmPassword">Confirm Password</label>
        <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Re-enter your password" autocomplete="new-password" />
        <span class="error-message" id="confirmPasswordError"></span>
      </div>

      <!-- Terms -->
      <div class="form-group checkbox-group">
        <label class="checkbox-label">
          <input type="checkbox" id="terms" name="terms" />
          I agree to the Terms &amp; Conditions
        </label>
        <span class="error-message" id="termsError"></span>
      </div>

      <button type="submit" class="submit-btn">Register</button>

      <p class="success-message" id="successMessage"> Registration successful!</p>
    </form>
  </main>

  <script src="script.js"></script>
</body>
</html>
